; XLivelessAddon successor
;
; Flat [Options] layout, the same style as ZolikaPatch.ini. A key that is absent
; uses its default; a value must be non-zero to enable it. An old
; ZolikaPatch.ini next to this file is used as a fallback for missing keys.

[Options]
; custom savegames folder; leave empty to use the game default
CustomSavePath=
; custom settings folder; leave empty to use the game default
CustomSettingsPath=
; skip the launcher/DRM checks (recovered DFA and ROM stages)
SkipLauncher=1
; remove the Rockstar Games registry path dependency
RemoveRegistryPathDependency=1
; skip the GFWL web-connect and health checks
SkipWebConnect=1
; shorten the intro screens to 300 ms
SkipIntro=1
; skip the main menu (hold SHIFT on startup to reach it)
SkipMenu=1
; keep rendering while the borderless window is unfocused
DoNotPauseOnMinimize=1
; borderless window
BorderlessWindowed=1
; fix the VRAM detection so the settings are not locked out
VRAMFix=1

; Report issues in this topic:
