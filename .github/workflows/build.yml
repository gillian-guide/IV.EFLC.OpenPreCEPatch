name: build

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # The companion ships next to this ASI; CI clones and builds it so the
      # download is the complete install: both ASIs and both INIs.
      - name: Checkout XLivelessAddon companion
        uses: actions/checkout@v4
        with:
          repository: gillian-guide/XLivelessAddon
          path: companion/XLivelessAddon
          submodules: recursive
          fetch-depth: 1

      # No -G: use whichever Visual Studio generator the image provides (the
      # windows-latest image moves between VS 2022 and VS 2026). -A Win32 is the
      # part that matters, because the game and the ASIs are 32-bit.
      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build/win-x86 -A Win32 -DCMAKE_CONFIGURATION_TYPES="Debug;Release;Trace"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build/win-x86 --config Release -- /m

      - name: Configure companion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S companion/XLivelessAddon -B companion-build -A Win32 -DCMAKE_CONFIGURATION_TYPES="Debug;Release;Trace"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build companion
        run: cmake --build companion-build --config Release -- /m

      # The download is deliberately just the four files a user installs; the
      # artifact GitHub wraps them in is the only archive.
      - name: Stage (both ASIs and INIs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item 'build/win-x86/Release/IV.EFLC.OpenPreCEPatch.asi' $dist
          Copy-Item 'build/win-x86/Release/IV.EFLC.OpenPreCEPatch.ini' $dist
          Copy-Item 'companion-build/Release/XLivelessAddon.asi' $dist
          Copy-Item 'companion-build/Release/XLivelessAddon.ini' $dist

          $expected = @(
            'IV.EFLC.OpenPreCEPatch.asi',
            'IV.EFLC.OpenPreCEPatch.ini',
            'XLivelessAddon.asi',
            'XLivelessAddon.ini')
          $actual = @(Get-ChildItem $dist -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object -ReferenceObject ($expected | Sort-Object) -DifferenceObject $actual) {
            throw "release folder contains unexpected files: $($actual -join ', ')"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IV.EFLC.OpenPreCEPatch
          path: dist/*
          if-no-files-found: error

  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build/win-x86 -A Win32 -DCMAKE_CONFIGURATION_TYPES="Debug;Release;Trace"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build/win-x86 --config Release -- /m

      # Image-dependent checks (the dump matrix, the body proof, the relocated
      # literals) are registered by CMake only when ../game_refs is present, so a
      # checkout without the game images runs the native and generated-file suite.
      - name: Test
        run: ctest --test-dir build/win-x86 -C Release --output-on-failure --timeout 300
