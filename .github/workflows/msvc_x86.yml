name: Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86:
    name: Windows x86 (shipped ASI)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check generated INI template
        run: python tools/gen_ini_template.py --check

      - name: Configure
        run: cmake --preset x86

      - name: Build
        run: cmake --build --preset x86-release -- /m

      - name: Test
        run: ctest --preset x86-release

      - name: Upload ASI
        uses: actions/upload-artifact@v7
        with:
          name: IV.EFLC.OpenPreCEPatch
          path: |
            bin/IV.EFLC.OpenPreCEPatch.asi
            bin/IV.EFLC.OpenPreCEPatch.ini
            bin/IV.EFLC.OpenPreCEPatch.map
          if-no-files-found: error

  x64-parity:
    name: Windows x64 (parity dump)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure
        run: cmake --preset x64

      - name: Build
        run: cmake --build --preset x64-release -- /m

      - name: Upload dump
        uses: actions/upload-artifact@v7
        with:
          name: opcep_parity_dump
          path: build/x64/Release/opcep_parity_dump.exe
          if-no-files-found: error
